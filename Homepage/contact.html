<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | Chic Standard</title>

  <meta
    name="description"
    content="Contact Chic Standard."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: #222;
      background: #faf8f5;
      line-height: 1.7;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5dfd8;
      padding: 20px 25px;
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .back {
      font-family: Arial, sans-serif;
      font-size: 12px;
      text-decoration: none;
      color: #555;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 100px 25px 120px;
      text-align: center;
    }

    .eyebrow {
      font-family: Arial, sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #77716b;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(45px, 7vw, 70px);
      font-weight: normal;
      line-height: 1.1;
      margin-bottom: 25px;
    }

    .intro {
      color: #666;
      font-size: 18px;
      margin-bottom: 45px;
    }

    .contact-box {
      background: #eee8e1;
      padding: 45px 30px;
    }

    .contact-box h2 {
      font-size: 28px;
      font-weight: normal;
      margin-bottom: 15px;
    }

    .email {
      display: inline-block;
      margin-top: 15px;
      font-family: Arial, sans-serif;
      font-size: 15px;
      text-decoration: underline;
      word-break: break-word;
    }

    footer {
      background: #fff;
      border-top: 1px solid #e5dfd8;
      text-align: center;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <div class="nav">

    <a href="../index.html" class="logo">
      CHIC STANDARD
    </a>

    <a href="../index.html" class="back">
      ← Back to Home
    </a>

  </div>
</header>

<main>

  <div class="eyebrow">
    Get in Touch
  </div>

  <h1>
    Contact
  </h1>

  <p class="intro">
    Have a question, suggestion or collaboration inquiry?
    We'd love to hear from you.
  </p>

  <div class="contact-box">

    <h2>
      Say Hello
    </h2>

    <p>
      For general questions, business inquiries or
      collaboration opportunities, please contact us by email.
    </p>

    <a
      class="email"
      href="mailto:jolinakemling10@gmail.com"
    >
      jolinakemling10@gmail.com
    </a>

  </div>

</main>

<footer>
  © 2026 Chic Standard
</footer>

</body>
</html>
